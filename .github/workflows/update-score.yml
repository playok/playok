name: update score

on:
  schedule:
    - cron: "10 21 * * *"   # UTC 21:10 = KST 06:10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파싱 로직 테스트
        run: python3 -m unittest discover -s scripts -v

      - name: 하이스코어 SVG 생성
        run: python3 scripts/build_score.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- assets/score.svg; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/score.svg
          git commit -m "chore: 하이스코어 갱신"
          git push
